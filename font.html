<!DOCTYPE html>
<html>
<head>
    <title>Simple Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Form Page</h2>

<form>
    Name: <input type="text"><br><br>
    Email: <input type="email"><br><br>
    Password: <input type="password"><br><br>

    Gender:
    <input type="radio" name="g"> Male
    <input type="radio" name="g"> Female
    <br><br>

    Skills:
    <input type="checkbox"> HTML
    <input type="checkbox"> CSS
    <br><br>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
</form>
<hr>

    

<h2>Student Table</h2>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Dept</th>
            <th>City</th>
            <th>Marks</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>1</td>
            <td>Arun</td>
            <td>IT</td>
            <td>Chennai</td>
            <td>85</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Bala</td>
            <td>CSE</td>
            <td>Madurai</td>
            <td>78</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Divya</td>
            <td>ECE</td>
            <td>Trichy</td>
            <td>90</td>
        </tr>
        <tr>
            <td>4</td>
            <td>Elan</td>
            <td>IT</td>
            <td>Salem</td>
            <td>88</td>
        </tr>
        <tr>
            <td>5</td>
            <td>Fathima</td>
            <td>CSE</td>
            <td>Coimbatore</td>
            <td>92</td>
        </tr>
    </tbody>

    <tfoot>
        <tr>
            <td colspan="4">Average</td>
            <td>86.6</td>
        </tr>
    </tfoot>
</table>
<hr>


<h2>Media Page</h2>

<!-- Image -->
<img src="image.jpg" alt="Nature Image" width="300">

<!-- Audio -->
<audio controls>
    <source src="audio.mp3" type="audio/mpeg">
</audio>

<!-- Video -->
<video width="320" height="240" controls>
    <source src="video.mp4" type="video/mp4">
</video>

</body>
</html>
